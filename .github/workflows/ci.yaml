name: CI

on:
  pull_request:
    branches:
      - main

# The documentation map push starts a new run on its commit, which cancels this one
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # The map tells the agent which pages exist, so it is generated here and never written by hand
  documentation-map:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2
        with:
          # A fork's branch lives in the fork: without this, the ref resolves in this repository
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          # A push made with GITHUB_TOKEN triggers no workflow, so the new commit would get no CI
          ssh-key: ${{ secrets.DOCUMENTATION_MAP_DEPLOY_KEY }}

      # Fails when a page has no title, diataxis-tag, or description
      - name: Generate the documentation map
        run: python3 .github/scripts/documentation-map.py > documentation-map.csv

      # A fork PR gets no secret, so it can't be pushed to: its author commits the map instead
      - name: Push the documentation map back to the PR if it changed
        env:
          FROM_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          git add documentation-map.csv
          git diff --cached --quiet && exit 0
          if [ "$FROM_FORK" = true ]; then
            echo "::error::documentation-map.csv is out of date: run 'python3 .github/scripts/documentation-map.py > documentation-map.csv' and commit it"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: update the documentation map"
          git push

  # A submodule pinned to a branch commit breaks the site once that branch is deleted
  submodules-on-main:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2
        with:
          submodules: recursive

      - name: Check submodules point at a commit on their main
        run: |
          git submodule foreach --quiet '
            git fetch -q --unshallow origin main
            git merge-base --is-ancestor HEAD origin/main || { echo "::error::$name is not on main"; exit 1; }'

  link-check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2
        with:
          submodules: recursive

      # Installs Node.js per mise.toml, matching local dev setup
      - name: Install mise
        uses: jdx/mise-action@v4.0.1
        with:
          version: 2026.4.0

      - name: Install dependencies
        working-directory: site
        run: npm install

      - name: Build site
        working-directory: site
        run: npm run build

      - name: Check every catalog module has a reference page
        run: |
          expected=$(find site/docs/_external/eks-forge-catalog/modules -mindepth 1 -maxdepth 1 -type d | wc -l)
          actual=$(find site/build/docs/reference/terraform_modules -mindepth 2 -maxdepth 2 -name index.html | wc -l)
          echo "modules: $expected, pages: $actual"
          [ "$expected" -eq "$actual" ] || { echo "::error::Module count ($expected) != generated pages ($actual)"; exit 1; }

      # GITHUB_TOKEN doesn't cover blob/tree URLs, so github.com throttles them: the remap checks
      # sibling repo files against the submodule checkouts instead.
      # 503 is accepted because github.com returns it at random for third-party blob pages and
      # lychee never retries 5xx (lycheeverse/lychee#2319). A dead link returns 404 and still fails.
      - name: Check site for broken links
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: >-
            --no-progress
            --remap "^https://github\.com/${{ github.repository_owner }}/(eks-forge-app-of-apps|eks-forge-catalog|eks-forge-live)/(blob|tree)/[^/]+/ file://${{ github.workspace }}/site/docs/_external/\$1/"
            --max-retries 0
            --host-concurrency 5
            --accept "200..=299,403,503"
            --root-dir "${{ github.workspace }}/site/build"
            --exclude "^https://eks-forge\.readthedocs\.io"
            "site/build/**/*.html"
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
