name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  link-check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2
        with:
          submodules: recursive

      # Installs Node.js per mise.toml, matching local dev setup
      - name: Install mise
        uses: jdx/mise-action@v4.0.1
        with:
          version: 2026.4.0

      - name: Install dependencies
        working-directory: site
        run: npm install

      - name: Build site
        working-directory: site
        run: npm run build

      - name: Check links
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: >-
            --no-progress
            --root-dir "${{ github.workspace }}/site/build"
            --exclude "^https://eks-forge\.readthedocs\.io"
            "site/build/**/*.html"
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
